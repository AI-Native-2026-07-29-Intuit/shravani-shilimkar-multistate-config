AWSTemplateFormatVersion: '2010-09-09'
Description: >
  multistate-network-dev: 3-AZ VPC with public/private subnets, a single
  Internet Gateway, and NAT gateway(s) gated by the EnvironmentName
  Condition -- one shared NAT GW in dev (cost discipline), one NAT GW per AZ
  in staging/prod (AZ-fault isolation). Also ships the application security
  group consumed by multistate-app-dev.yaml. Deploy stack name MUST be
  multistate-network-dev -- multistate-app-dev.yaml imports this stack's
  outputs by that literal name via !ImportValue.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: >
      Selects the NAT topology: dev gets one shared NAT GW; staging/prod get
      one NAT GW per AZ so a single AZ outage can't take out every private
      subnet's egress.
  VpcCidr:
    Type: String
    Default: 10.42.0.0/16
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'

Conditions:
  NatPerAz: !Or
    - !Equals [!Ref EnvironmentName, staging]
    - !Equals [!Ref EnvironmentName, prod]
  SingleNat: !Not [!Condition NatPerAz]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub 'multistate-${EnvironmentName}-vpc'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub 'multistate-${EnvironmentName}-igw'

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # ---------- Public subnets (one per AZ) ----------
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 6, 8]]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub 'multistate-${EnvironmentName}-public-a'

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 6, 8]]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub 'multistate-${EnvironmentName}-public-b'

  PublicSubnetC:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [2, !GetAZs '']
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 6, 8]]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub 'multistate-${EnvironmentName}-public-c'

  # ---------- Private subnets (one per AZ) ----------
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Select [3, !Cidr [!Ref VpcCidr, 6, 8]]
      Tags:
        - Key: Name
          Value: !Sub 'multistate-${EnvironmentName}-private-a'

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: !Select [4, !Cidr [!Ref VpcCidr, 6, 8]]
      Tags:
        - Key: Name
          Value: !Sub 'multistate-${EnvironmentName}-private-b'

  PrivateSubnetC:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [2, !GetAZs '']
      CidrBlock: !Select [5, !Cidr [!Ref VpcCidr, 6, 8]]
      Tags:
        - Key: Name
          Value: !Sub 'multistate-${EnvironmentName}-private-c'

  # ---------- Public routing (shared, one table) ----------
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub 'multistate-${EnvironmentName}-public-rt'

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetCRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetC
      RouteTableId: !Ref PublicRouteTable

  # ---------- NAT: single shared GW (dev) ----------
  SingleNatEip:
    Type: AWS::EC2::EIP
    Condition: SingleNat
    Properties:
      Domain: vpc

  SingleNatGateway:
    Type: AWS::EC2::NatGateway
    Condition: SingleNat
    Properties:
      AllocationId: !GetAtt SingleNatEip.AllocationId
      SubnetId: !Ref PublicSubnetA
      Tags:
        - Key: Name
          Value: !Sub 'multistate-${EnvironmentName}-nat-shared'

  # ---------- NAT: one GW per AZ (staging/prod) ----------
  NatEipA:
    Type: AWS::EC2::EIP
    Condition: NatPerAz
    Properties:
      Domain: vpc

  NatEipB:
    Type: AWS::EC2::EIP
    Condition: NatPerAz
    Properties:
      Domain: vpc

  NatEipC:
    Type: AWS::EC2::EIP
    Condition: NatPerAz
    Properties:
      Domain: vpc

  NatGatewayA:
    Type: AWS::EC2::NatGateway
    Condition: NatPerAz
    Properties:
      AllocationId: !GetAtt NatEipA.AllocationId
      SubnetId: !Ref PublicSubnetA
      Tags:
        - Key: Name
          Value: !Sub 'multistate-${EnvironmentName}-nat-a'

  NatGatewayB:
    Type: AWS::EC2::NatGateway
    Condition: NatPerAz
    Properties:
      AllocationId: !GetAtt NatEipB.AllocationId
      SubnetId: !Ref PublicSubnetB
      Tags:
        - Key: Name
          Value: !Sub 'multistate-${EnvironmentName}-nat-b'

  NatGatewayC:
    Type: AWS::EC2::NatGateway
    Condition: NatPerAz
    Properties:
      AllocationId: !GetAtt NatEipC.AllocationId
      SubnetId: !Ref PublicSubnetC
      Tags:
        - Key: Name
          Value: !Sub 'multistate-${EnvironmentName}-nat-c'

  # ---------- Private routing (one table per AZ; target NAT picked by Condition) ----------
  PrivateRouteTableA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub 'multistate-${EnvironmentName}-private-rt-a'

  PrivateDefaultRouteA:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTableA
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !If [NatPerAz, !Ref NatGatewayA, !Ref SingleNatGateway]

  PrivateSubnetARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTableA

  PrivateRouteTableB:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub 'multistate-${EnvironmentName}-private-rt-b'

  PrivateDefaultRouteB:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTableB
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !If [NatPerAz, !Ref NatGatewayB, !Ref SingleNatGateway]

  PrivateSubnetBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTableB

  PrivateRouteTableC:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub 'multistate-${EnvironmentName}-private-rt-c'

  PrivateDefaultRouteC:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTableC
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !If [NatPerAz, !Ref NatGatewayC, !Ref SingleNatGateway]

  PrivateSubnetCRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetC
      RouteTableId: !Ref PrivateRouteTableC

  # ---------- Application security group ----------
  ApplicationSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub 'multistate-${EnvironmentName}-app-sg'
      GroupDescription: >
        multistate-api workload SG. Ingress restricted to the app port from
        within the VPC only; no 0.0.0.0/0 ingress. Egress open (private
        subnets still egress only via NAT).
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - Description: App port from within the VPC (ALB/other in-VPC callers)
          IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: !Ref VpcCidr
      SecurityGroupEgress:
        - Description: Unrestricted egress (NAT-gated at the subnet level)
          IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub 'multistate-${EnvironmentName}-app-sg'

Outputs:
  VpcId:
    Value: !Ref Vpc
    Export:
      Name: !Sub '${AWS::StackName}-VpcId'
  PublicSubnets:
    Description: Comma-delimited list of public subnet IDs, one per AZ.
    Value: !Join [',', [!Ref PublicSubnetA, !Ref PublicSubnetB, !Ref PublicSubnetC]]
    Export:
      Name: !Sub '${AWS::StackName}-PublicSubnets'
  PrivateSubnets:
    Description: >
      Comma-delimited list of private subnet IDs, one per AZ. Imported by
      multistate-app-dev.yaml via !ImportValue multistate-network-dev-PrivateSubnets.
    Value: !Join [',', [!Ref PrivateSubnetA, !Ref PrivateSubnetB, !Ref PrivateSubnetC]]
    Export:
      Name: !Sub '${AWS::StackName}-PrivateSubnets'
  ApplicationSecurityGroupId:
    Value: !Ref ApplicationSecurityGroup
    Export:
      Name: !Sub '${AWS::StackName}-ApplicationSecurityGroupId'
