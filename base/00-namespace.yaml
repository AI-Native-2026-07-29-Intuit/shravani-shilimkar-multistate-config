# Bounded blast radius for multistate-api: a dedicated namespace with a hard
# ceiling (ResourceQuota) and sane per-container defaults (LimitRange) so a
# pod that forgets requests/limits still gets scheduled predictably.

apiVersion: v1
kind: Namespace
metadata:
  name: multistate-dev
  labels:
    app.kubernetes.io/name:       multistate-dev
    app.kubernetes.io/component:  namespace
    app.kubernetes.io/part-of:    multistate
    app.kubernetes.io/managed-by: kubectl
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: multistate-dev-quota
  namespace: multistate-dev
spec:
  hard:
    requests.cpu:    "4"
    requests.memory: 8Gi
    limits.cpu:      "8"
    limits.memory:   16Gi
    pods:            "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: multistate-dev-defaults
  namespace: multistate-dev
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu:    100m
        memory: 256Mi
      default:
        cpu:    500m
        memory: 768Mi
