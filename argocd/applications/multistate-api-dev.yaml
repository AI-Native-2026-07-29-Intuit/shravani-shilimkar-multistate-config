# argocd/applications/multistate-api-dev.yaml
# Single-env Application for the dev overlay. The ApplicationSet
# (Task 3) generates the matching staging + prod Applications via
# a matrix generator. This file stays as the dev anchor so a
# brand-new contributor has one concrete Application to read.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: multistate-api-dev
  namespace: argocd
  # Without this finalizer, deleting the Application leaves the
  # Deployment + Service + ConfigMap orphaned in the cluster.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    env: dev
    team: multistate
spec:
  # MUST be the project name -- never "default".
  project: multistate

  source:
    repoURL: https://github.com/AI-Native-2026-07-29-Intuit/shravani-shilimkar-multistate-config.git
    path: overlays/dev
    # Tracking the feature branch until the PR merges -- flip to `main`
    # once w6d2-implementation lands.
    targetRevision: w6d2-implementation

  destination:
    server: https://kubernetes.default.svc
    namespace: multistate-dev

  syncPolicy:
    automated:
      prune: true       # remove resources deleted from Git
      selfHeal: true     # revert drift from kubectl edit on live cluster
      allowEmpty: false  # never sync an empty manifest set (deletes everything)
    syncOptions:
      - CreateNamespace=true     # first sync creates multistate-dev if missing
      - ServerSideApply=true     # avoids the 256 kB last-applied-config limit
      - PrunePropagationPolicy=foreground
      - PruneLast=true           # workloads pruned AFTER their dependencies
      - ApplyOutOfSyncOnly=true  # skip already-converged resources
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

  # multistate-api-secrets ships a committed placeholder password
  # (base/40-multistate-api.secret.yaml) that can never authenticate
  # against a real Postgres. The real dev-local password gets set
  # directly on the live Secret (kubectl patch, never committed to this
  # public repo) -- without this ignoreDifferences, selfHeal reverts it
  # back to the placeholder on every reconcile and every pod
  # CrashLoopBackOffs on auth failure.
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: multistate-api-secrets
      jsonPointers:
        - /data/SPRING_DATASOURCE_PASSWORD
