# argocd/projects/multistate.yaml
# Narrow AppProject: no '*' wildcards anywhere. Task 2 expands the
# namespace-resource whitelist as later manifests (ServiceMonitor,
# AlertmanagerConfig, etc.) get added to base/.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: multistate
  namespace: argocd
spec:
  description: Multi-State Tax Compliance Tracker -- scoped GitOps project

  sourceRepos:
    - https://github.com/AI-Native-2026-07-29-Intuit/shravani-shilimkar-multistate-config.git

  destinations:
    - namespace: multistate-dev
      server: https://kubernetes.default.svc
    - namespace: multistate-staging
      server: https://kubernetes.default.svc
    - namespace: multistate-prod
      server: https://kubernetes.default.svc

  # Namespace is cluster-scoped in Argo CD's eyes even though
  # base/00-namespace.yaml lives alongside namespaced resources -- an
  # empty list here blocks it outright (confirmed: sync fails with
  # "resource :Namespace is not permitted in project multistate").
  # Everything else stays off this list; no other cluster-scoped kind
  # is ever needed by this project.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace

  # Only the namespace-scoped kinds the W5 D3 manifests actually use.
  namespaceResourceWhitelist:
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    - group: apps
      kind: Deployment
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: networking.k8s.io
      kind: Ingress
